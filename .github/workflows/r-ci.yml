name: R CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: R 4.6.1 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      CI: "true"
      WLV_WORKERS: "1"
      R_ENVIRON_USER: "${{ github.workspace }}/.github/Renviron.ci"
      RENV_PATHS_ROOT: "${{ runner.temp }}/renv"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: |
            ${{ env.RENV_PATHS_ROOT }}
            renv/library
          key: renv-${{ runner.os }}-R-4.6.1-${{ hashFiles('renv.lock') }}
          restore-keys: renv-${{ runner.os }}-R-4.6.1-
      - name: Verify the explicit bootstrap
        run: Rscript --vanilla scripts/bootstrap.R
      - name: Check safe startup
        run: Rscript --vanilla tests/smoke/startup.R
      - name: Check the entrypoint from outside the checkout
        shell: pwsh
        run: |
          Push-Location "${{ runner.temp }}"
          try {
            Rscript --vanilla "${{ github.workspace }}/scripts/run_wlv.R" --method wiodr13 --check
          } finally {
            Pop-Location
          }
      - name: Parse source and load the entrypoint
        shell: Rscript {0}
        run: |
          source("renv/activate.R")
          files <- list.files("R", pattern = "\\.[Rr]$", recursive = TRUE, full.names = TRUE)
          invisible(lapply(files, parse))
          source("R/main.R")
          stopifnot(is.function(get_wlv), is.function(recalc_wlv))
      - name: Run tests
        shell: Rscript {0}
        run: |
          source("renv/activate.R")
          testthat::test_dir("tests/testthat", reporter = "summary")
